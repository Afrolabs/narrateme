name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP fetches any missing platform itself.
      # setup-android@v3's default package list ('tools') no longer exists in sdkmanager.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew :core:test :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: narrateme-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
